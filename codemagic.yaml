# Codemagic CI/CD — builds the Caremid Carer app (Capacitor) on a cloud Mac and
# publishes to TestFlight / App Store. No local Mac needed.
#
# One-time setup (see carer-app/CODEMAGIC.md):
#   1. Connect this GitHub repo in Codemagic.
#   2. Add an App Store Connect API key integration named "CaremidASC".
#   3. Create the app record in App Store Connect (bundle id uk.co.caremid.carer).
#   4. Run the "carer-ios" workflow.

workflows:
  carer-ios:
    name: Caremid Carer — iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CaremidASC
    environment:
      vars:
        BUNDLE_ID: "uk.co.caremid.carer"
        XCODE_WORKSPACE: "carer-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        MARKETING_VERSION: "1.0.0"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies & build
        script: |
          cd carer-app
          npm ci
          npm run build
      - name: Generate & sync the iOS project
        script: |
          cd carer-app
          # Fresh iOS project each build (keeps the repo clean); appId from
          # capacitor.config.ts sets the bundle identifier automatically.
          # `cap add ios` is a no-op/err if the platform already exists — keep going.
          npx cap add ios || true
          npx cap sync ios
          echo "--- carer-app/ios/App contents ---"
          ls -la ios/App || true
      - name: Add camera / photo-library permission strings
        script: |
          PLIST="carer-app/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take a photo of a receipt to attach to a financial transaction record.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Attach a receipt photo from your library to a financial transaction record.'" "$PLIST"
      - name: Set version & build number
        script: |
          cd carer-app/ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Install CocoaPods (if the project uses them)
        script: |
          cd carer-app/ios/App
          # Capacitor 8 generates a Swift Package Manager project (no Podfile);
          # only run pod install when a CocoaPods Podfile is actually present.
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile — Capacitor iOS project uses Swift Package Manager; skipping pod install."
          fi
      - name: Set up code signing (automatic, via API key)
        script: |
          keychain initialize
          # The Codemagic CLI will NOT generate a signing private key on its own
          # (every earlier build failed with "Cannot create resource without
          # certificate private key"), so generate an RSA key here and hand it to
          # fetch-signing-files. With --create and that key, it mints a fresh
          # distribution certificate AND the App Store provisioning profile for
          # this bundle id, and saves a .p12 the keychain can import.
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          # Apply the fetched profiles to this specific project (Capacitor 8 SPM).
          xcode-project use-profiles --project "carer-app/ios/App/App.xcodeproj"
      - name: Build the IPA
        script: |
          cd carer-app
          # Use the workspace when CocoaPods generated one; otherwise build the
          # plain Xcode project (Swift Package Manager setup).
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          fi
    artifacts:
      - carer-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Sends the build to TestFlight automatically. Flip submit_to_app_store
        # to true (and remove the comment) once you're happy on TestFlight and
        # the App Store listing is filled in.
        submit_to_testflight: true
        # submit_to_app_store: true
