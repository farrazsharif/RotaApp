# Codemagic CI/CD — builds the Caremid Carer app (Capacitor) on a cloud Mac and
# publishes to TestFlight / App Store. No local Mac needed.
#
# One-time setup (see carer-app/CODEMAGIC.md):
#   1. Connect this GitHub repo in Codemagic.
#   2. Add an App Store Connect API key integration named "CaremidASC".
#   3. Create the app record in App Store Connect (bundle id uk.co.caremid.carer).
#   4. Run the "carer-ios" workflow.

workflows:
  carer-ios:
    name: Caremid Carer — iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CaremidASC
    environment:
      groups:
        # Holds CERT_PRIVATE_KEY: the one persistent signing key, shared with
        # the Solutions app, which uses the same Apple account.
        - ios_signing
      vars:
        BUNDLE_ID: "uk.co.caremid.carer"
        XCODE_WORKSPACE: "carer-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        MARKETING_VERSION: "1.0.2"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies & build
        script: |
          cd carer-app
          npm ci
          npm run build
      - name: Generate & sync the iOS project
        script: |
          cd carer-app
          # The iOS project is COMMITTED (it carries the Live Activity widget
          # extension target, which a regenerated project would wipe), so only
          # sync — never `cap add ios`, which would overwrite it.
          npx cap sync ios
          echo "--- carer-app/ios/App contents ---"
          ls -la ios/App || true
      - name: Add Info.plist keys (permissions + export compliance)
        script: |
          PLIST="carer-app/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take a photo of a receipt to attach to a financial transaction record.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Attach a receipt photo from your library to a financial transaction record.'" "$PLIST"
          # The app only uses standard HTTPS/TLS (exempt encryption), so declare
          # no non-exempt encryption. This auto-answers the App Store Connect
          # export-compliance question on every build (no "Missing Compliance").
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
      - name: Set version & build number
        script: |
          cd carer-app/ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Install CocoaPods (if the project uses them)
        script: |
          cd carer-app/ios/App
          # Capacitor 8 generates a Swift Package Manager project (no Podfile);
          # only run pod install when a CocoaPods Podfile is actually present.
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile — Capacitor iOS project uses Swift Package Manager; skipping pod install."
          fi
      - name: Set up code signing (automatic, via API key)
        script: |
          keychain initialize
          # ONE PERSISTENT SIGNING KEY, supplied as a secure environment
          # variable and shared with the Caremid Solutions app, which lives on
          # the same Apple account.
          #
          # This used to generate a throwaway key per run, which meant a fresh
          # distribution certificate every build; Apple caps those at two, so
          # each run also revoked every existing one to make room. That looked
          # harmless and was not. Apple re-validates a build's signature when
          # it is SUBMITTED, not only when it is uploaded — so revoking a
          # certificate invalidates any build signed with it that has not yet
          # been through review. Caremid build 24 was signed in October, sat in
          # TestFlight happily, and was rejected with ITMS-90035 on 5 Nov
          # because the Solutions build the day before had revoked its
          # certificate.
          #
          # Reusing one key means no new certificate is ever minted, nothing
          # needs revoking, and the two apps stop invalidating each other.
          set -e
          if [ -z "$CERT_PRIVATE_KEY" ]; then
            echo "ERROR: CERT_PRIVATE_KEY is not set."
            echo "Add it as a secure variable in the ios_signing group in Codemagic."
            exit 1
          fi
          # The value is expected base64-encoded: a PEM is multi-line, and a
          # multi-line secret does not survive the round trip through a CI
          # variable intact (build 25 failed with "Provided value in file
          # /tmp/cert_key.pem is not valid" for exactly this reason). A plain
          # PEM is still accepted, so an existing variable keeps working.
          case "$CERT_PRIVATE_KEY" in
            *BEGIN*) printf '%s\n' "$CERT_PRIVATE_KEY" > /tmp/cert_key.pem ;;
            *)       printf '%s' "$CERT_PRIVATE_KEY" | base64 --decode > /tmp/cert_key.pem ;;
          esac
          chmod 600 /tmp/cert_key.pem
          # Check the key here rather than letting fetch-signing-files reject it
          # and the build carry on to fail 50 lines later at the archive.
          if ! openssl rsa -in /tmp/cert_key.pem -check -noout >/dev/null 2>&1; then
            echo "ERROR: CERT_PRIVATE_KEY did not decode to a valid RSA private key."
            echo "Store it base64-encoded, on one line, with no quotes."
            exit 1
          fi
          echo "Signing key: $(wc -c < /tmp/cert_key.pem | tr -d ' ') bytes, $(head -1 /tmp/cert_key.pem)"
          # Hand the key over through the CLI's own environment variable rather
          # than --certificate-key=@file:, which build 26 rejected outright with
          # "invalid string value: '@file:/tmp/cert_key.pem'". This is the form
          # Codemagic documents, and it keeps the key off the command line.
          CERTIFICATE_PRIVATE_KEY=$(cat /tmp/cert_key.pem)
          export CERTIFICATE_PRIVATE_KEY
          rm -f /tmp/cert_key.pem
          # With a key that already has a certificate, this fetches it rather
          # than creating another.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          # The Live Activity widget is a separate target with its own bundle
          # id, so it needs its own App Store profile. Same certificate.
          app-store-connect fetch-signing-files "$BUNDLE_ID.LiveActivity" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          # Apply the fetched profiles to this specific project (Capacitor 8 SPM).
          xcode-project use-profiles --project "carer-app/ios/App/App.xcodeproj"
      - name: Build the IPA
        script: |
          cd carer-app
          # Use the workspace when CocoaPods generated one; otherwise build the
          # plain Xcode project (Swift Package Manager setup).
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          fi
      - name: Verify the IPA signature
        script: |
          # ITMS-90035 (invalid signature) is only reported by Apple AFTER the
          # upload, by which point a review slot has been spent. Check it here
          # instead, and print what the binary was actually signed with.
          #
          # Non-fatal on purpose: codesign objects to things that upload
          # perfectly well, and a false failure here would block the only
          # route there is to an iOS build.
          set +e
          IPA=$(ls carer-app/build/ios/ipa/*.ipa | head -1)
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -1)
          echo "== Signed with =="
          codesign -dvvv "$APP" 2>&1 | grep -iE "Authority|TeamIdentifier|^Identifier"
          echo "== Verification =="
          codesign --verify --strict --verbose=2 "$APP" 2>&1 \
            || echo "WARNING: codesign verification failed - expect ITMS-90035 on upload"
          echo "== Embedded bundles =="
          find "$APP" \( -name "*.appex" -o -name "*.framework" -o -name "*.bundle" \) -maxdepth 3
          rm -rf "$WORK"
          set -e
      - name: Verify the widget extension is embedded
        script: |
          # Proves the Live Activity widget actually shipped inside the app -
          # otherwise the timer silently never appears on the phone.
          unzip -l carer-app/build/ios/ipa/*.ipa | grep -i ".appex" || echo "WARNING: no .appex found in the IPA"
    artifacts:
      - carer-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Sends the build to TestFlight automatically. Flip submit_to_app_store
        # to true (and remove the comment) once you're happy on TestFlight and
        # the App Store listing is filled in.
        submit_to_testflight: true
        # submit_to_app_store: true

  # Android build. Produces a debug APK that
  # can be installed straight onto a phone - so the app can be tested before any
  # Play Console or signing setup exists. Release signing + Play upload come later.
  carer-android:
    name: Caremid Carer — Android
    # Linux instances are not on this billing plan; the Mac builds Android fine.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "uk.co.caremid.carer"
      node: 22
      java: 21
    scripts:
      - name: Install web dependencies & build
        script: |
          cd carer-app
          npm ci
          npm run build
      - name: Sync the Android project
        script: |
          cd carer-app
          # The android/ project is COMMITTED, so only sync - never `cap add`.
          npx cap sync android
      - name: Build the debug APK
        script: |
          cd carer-app/android
          # The repo is authored on Windows, which does not carry the exec bit.
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - carer-app/android/app/build/outputs/**/*.apk

  # Signed Android App Bundle for Google Play. Needs an Android keystore
  # uploaded in Codemagic under Code signing identities with the reference
  # name "caremid_upload" - that injects CM_KEYSTORE_PATH / _PASSWORD /
  # CM_KEY_ALIAS / CM_KEY_PASSWORD, which app/build.gradle reads. The keystore
  # itself is never committed.
  carer-android-release:
    name: Caremid Carer — Android (Play release)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "uk.co.caremid.carer"
      android_signing:
        - caremid_upload
      node: 22
      java: 21
    scripts:
      - name: Install web dependencies & build
        script: |
          cd carer-app
          npm ci
          npm run build
      - name: Sync the Android project
        script: |
          cd carer-app
          # The android/ project is COMMITTED, so only sync - never `cap add`.
          npx cap sync android
      - name: Build the signed App Bundle
        script: |
          cd carer-app/android
          # The repo is authored on Windows, which does not carry the exec bit.
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Verify the bundle is signed
        script: |
          # Must target the final release bundle: the build tree also holds an
          # unsigned "intermediary-bundle.aab" that a loose find would match first.
          AAB=$(ls carer-app/android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "Bundle: $AAB"
          # An unsigned bundle has no META-INF signature block, and Play would
          # reject it - fail here instead of finding out after the upload.
          if unzip -l "$AAB" | grep -qi "META-INF/.*\.RSA\|META-INF/.*\.EC"; then
            echo "Bundle is signed."
          else
            echo "ERROR: bundle is not signed - check the caremid_upload keystore in Codemagic."
            exit 1
          fi
    artifacts:
      - carer-app/android/app/build/outputs/bundle/**/*.aab
      - carer-app/android/app/build/outputs/**/mapping.txt
