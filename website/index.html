<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caremid — Care management & rota software for UK care providers</title>
    <meta
      name="description"
      content="Caremid is all-in-one scheduling, care planning, eMAR and invoicing software for domiciliary and residential care providers in the UK."
    />
    <meta property="og:title" content="Caremid — Care management software for UK care providers" />
    <meta
      property="og:description"
      content="Scheduling, care planning, eMAR and funder invoicing in one place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.caremid.co.uk" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Retire any leftover service worker from when the app lived on this
      // origin, so returning visitors get the website and not the cached app.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister());
        });
        if (window.caches) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
